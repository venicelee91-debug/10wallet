<title>현대해상 타겟DB보유현황</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: 통장 한 권처럼 좁은 단일 컬럼(최대 560px). 홈 → 매니저 → FC 3단 화면, 카드는 FC·고객 단위로만 쓴다 */
:root{
  /* 현대해상 CI: 네이비(#071645) + 오렌지(#F5A31F). 네이비는 버튼·제목, 오렌지는 강조 한 곳씩만 */
  --bg:#f3f4f8; --paper:#ffffff; --ink:#0b1638; --muted:#5a6282; --line:#dfe2ec;
  --accent:#0d1f5c; --accent-soft:#e8ebf6; --accent-ink:#ffffff;
  --brand:#f5a31f; --brand-ink:#0b1638; --brand-text:#b86a00; --brand-soft:#fff3df;
  --gap:#cf3b2b; --gap-soft:#fdecea; --chk:#2c7a8c; --chk-soft:#e3f2f5;
  --done:#8b91a8;
  --f-body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:var(--f-body);
  --r:14px;
}
:root,:root[data-theme="dark"]{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;text-wrap:balance;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:500}
.hero h1{font-size:24px;line-height:1.25;margin-top:4px;letter-spacing:-.025em}
.hero h1::after{content:"";display:block;width:44px;height:3px;border-radius:2px;background:var(--brand);margin-top:8px}
.hero .sub{color:var(--brand-text);font-weight:700;font-size:17px;margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.02em}
.kpi .v small{font-family:var(--f-body);font-size:12px;font-weight:400;margin-left:1px}
.kpi.hl .v{color:var(--brand-text)}
.sec{font-weight:700;font-size:15px;margin:8px 2px 0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.mcard:hover{border-color:var(--accent)}
.mcard b{font-size:16px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:999px;padding:2px 8px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.a{background:var(--accent-soft);color:var(--accent);font-weight:500}
.pill.g{background:var(--gap-soft);color:var(--gap);font-weight:500}
.pill.c{background:var(--chk-soft);color:var(--chk);font-weight:500}
.pill.brand{background:var(--brand-soft);color:var(--brand-text);font-weight:700}
.pts{list-style:none;margin:0;padding:8px 10px;background:var(--bg);border-radius:10px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.pts li::before{content:"·";color:var(--muted);margin-right:6px}
.pts li b{color:var(--accent)}
.pts li.no{color:var(--gap);font-weight:500}
.pts li.hl,.pts li.hl b{color:var(--gap);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
details.how{background:var(--bg);border-radius:10px;padding:8px 12px;font-size:13px}
details.how summary{cursor:pointer;color:var(--accent);font-weight:500;text-align:center;list-style:none}
details.how summary::-webkit-details-marker{display:none}
details.how ul{margin:8px 0 2px;padding-left:18px;color:var(--muted)}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:15px;padding:11px 40px 11px 40px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.search input:focus{outline:none;border-color:var(--accent)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:18px;width:32px;height:32px;border-radius:50%;line-height:1}
.search .clear:hover{background:var(--bg)}
/* FC row (매니저 화면) */
.fc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.fc.sent{opacity:.72}
.fc-head{display:flex;justify-content:space-between;gap:8px 10px;align-items:center;flex-wrap:wrap}
.fc-head .nm{font-size:17px;font-weight:700}
.fc-head .br{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.fc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;text-align:center}
.fc-stats div{background:var(--bg);border-radius:8px;padding:6px 4px}
.fc-stats .l{font-size:11px;color:var(--muted)}
.fc-stats .v{font-size:17px;font-weight:600}
.fc-stats .v.big{font-size:24px;font-weight:700;line-height:1.1}
.acts{display:flex;flex-direction:row;gap:6px;flex-shrink:0}
.fc-stats.five{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.fc-stats.five .l{font-size:10.5px;line-height:1.25;min-height:2.5em;display:flex;align-items:center;justify-content:center}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--line);padding:4px;border-radius:12px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgb(11 22 56 / .08)}
.tabs .num{font-weight:500;margin-left:2px;color:var(--muted)}
.brbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brbar b{font-size:15px}
.brlist{display:flex;flex-direction:column;gap:8px}
.brcard{display:grid;grid-template-columns:1fr auto;grid-template-areas:"nm arrow" "chips arrow";gap:6px 10px;align-items:center;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.brcard:hover{border-color:var(--accent)}
.brcard .nm{grid-area:nm;font-size:16px;font-weight:700;overflow-wrap:anywhere}
.brcard .chips{grid-area:chips}
.brcard .arrow{grid-area:arrow;font-size:22px;color:var(--muted)}
.acts .btn{padding:6px 10px;white-space:nowrap}
.days{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:4px;align-items:center;font-size:11px}
.days .wk{color:var(--muted);padding-right:4px}
.day{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:3px 0;text-align:center;line-height:1.2}
.day .d{font-family:var(--f-num);font-size:13px;font-weight:600}
.day.today{border-color:var(--ink);border-width:2px}
.day.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.day.future{opacity:.6}
.seen{font-size:12px;color:var(--muted)}
/* 고객 카드 (FC 화면) */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.cu{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.cu.hot{border-color:color-mix(in srgb,var(--brand) 70%,var(--line))}
.cu.done{opacity:.6}
.cu-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cu-head .nm{font-size:17px;font-weight:700}
.meta{font-size:12px;color:var(--muted)}
.cov{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px;border-top:1px dashed var(--line);padding-top:8px}
.cov .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
.cov .v.no{color:var(--gap);font-family:var(--f-body);font-weight:700}
.cov .v.ok{color:var(--accent);font-family:var(--f-body);font-weight:700}
.cov .v.unk{color:var(--muted);font-family:var(--f-body);font-size:12px}
.point{background:var(--gap-soft);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:13px}
.point b{color:var(--gap)}
.point.c{background:var(--chk-soft)}
.point.c b{color:var(--chk)}
.point.ok{background:var(--accent-soft)}
.point.ok b{color:var(--accent)}
.cu-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* 잠금 화면 */
.lock{display:flex;flex-direction:column;gap:12px}
.lock input:not([type="checkbox"]){font:inherit;font-family:var(--f-num);font-size:20px;letter-spacing:.15em;text-transform:uppercase;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.err{color:var(--gap);font-size:13px;min-height:1.2em}
.chk-row{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer;user-select:none;width:fit-content}
.chk-row input[type="checkbox"]{width:18px;height:18px;margin:0;flex:none;accent-color:var(--accent);cursor:pointer}
/* 보내기 시트 */
.sheet{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:0 max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px))}
.sheet .box{background:var(--paper);color:var(--ink);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.sheet textarea{width:100%;min-height:190px;font:inherit;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1;padding:10px 12px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13px;z-index:40;max-width:calc(100% - 32px);text-align:center}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:24px 0}
@media (prefers-reduced-motion:no-preference){.fc,.cu{transition:opacity .2s}}
</style>
</head>

const pad = n => String(n).padStart(2,"0");

const today = new Date(); const TODAY = iso(today);
function weeks(){
  const mon = new Date(today); const wd = (today.getDay()+6)%7; mon.setDate(today.getDate()-wd);
  if (wd >= 5) mon.setDate(mon.getDate()+7); // 주말이면 다음 주부터
  const mk = off => Array.from({length:5}, (_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+off+i); return d });
  return [mk(0), mk(7)];
}

/* ---------- FC 화면 ---------- */
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const AES = {name:"AES-GCM"};
async function openBlob(enc, wrapKey, wrapped, wiv){
  const raw = await crypto.subtle.decrypt({...AES, iv:b64d(wiv)}, wrapKey, b64d(wrapped));
  const dk = await crypto.subtle.importKey("raw", raw, AES, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({...AES, iv:b64d(enc.i)}, dk, b64d(enc.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function pbkdf(text, salt, iter, extractable){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(text), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64d(salt), iterations:iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, extractable, ["decrypt"]);
}
async function decrypt(enc, code){
  const key = await pbkdf(code.trim().toUpperCase(), enc.s, DATA.iter, false);
  return openBlob(enc, key, enc.w, enc.wi);
}
/* ---------- 관리자 ---------- */
let adminKey = null;
async function loadAdmin(){
  const raw = store.get("adm", null); if (!raw) return;
  try { const k = await crypto.subtle.importKey("raw", b64d(raw), AES, false, ["decrypt"]);
        await crypto.subtle.decrypt({...AES, iv:b64d(DATA.adm.ci)}, k, b64d(DATA.adm.chk)); adminKey = k }
  catch(_){ store.set("adm", null) }
}
async function adminLogin(pw, remember){
  const k = await pbkdf(pw.trim().toLowerCase(), DATA.adm.s, DATA.adm.iter, true);
  await crypto.subtle.decrypt({...AES, iv:b64d(DATA.adm.ci)}, k, b64d(DATA.adm.chk)); // 틀리면 여기서 실패
  adminKey = k;
  if (remember){ const raw = new Uint8Array(await crypto.subtle.exportKey("raw", k)); store.set("adm", btoa(String.fromCharCode(...raw))) }
  return true;
}
function adminLogout(){ adminKey = null; store.set("adm", null); for (const k in opened) delete opened[k]; render() }

  <div class="top">${inApp?`<button class="btn" data-go="m-${m.id}">‹ 매니저 화면</button>`:"<span></span>"}${adminKey ? `<span class="pill brand">관리자 모드</span>` : `<button class="btn" data-lock="${f.id}">잠그기</button>`}</div>
  <section class="panel hero">
    <div class="eyebrow">현대해상 타겟DB보유현황 · ${esc(m.name)} 매니저 · ${asofLbl}</div>
    <h1>${esc(f.name)} 설계사님 현대해상 타겟DB보유현황</h1>
    <div class="muted" style="font-size:13px;overflow-wrap:anywhere">${esc(f.br)}</div>
  </section>
  <div class="kpis">
    <div class="kpi"><div class="l">대상 고객</div><div class="v num">${cs.length}<small>명</small></div></div>
    <div class="kpi hl"><div class="l">우선 연락</div><div class="v num">${counts.t1}<small>명</small></div></div>
    <div class="kpi"><div class="l">연락함</div><div class="v num">${doneN}<small>명</small></div></div>
  </div>
  <div class="filters" role="group" aria-label="고객 거르기">
    ${F.filter(([k]) => k==="all" || counts[k]).map(([k,l]) => `<button data-f="${k}" aria-pressed="${fcFilter===k}">${l} ${counts[k]}</button>`).join("")}
  </div>
  ${list.length ? list.map(card).join("") : `<div class="empty">이 조건의 고객이 없어요.</div>`}
  <div class="foot">우선 연락 → 가입 가능 → 개별 확인 순으로 보여요. 연락함 표시는 이 휴대폰에만 저장돼요.</div>`;
}
function toggleDone(fcid, k){
  const done = store.get("done2:"+fcid, {});
  if (done[k]) delete done[k]; else done[k] = `${today.getMonth()+1}/${today.getDate()}`;
  store.set("done2:"+fcid, done); render();
}

/* ---------- 라우팅 ---------- */
let lastMgr = null;
function render(){
  const h = location.hash.slice(1);
  if (h.startsWith("m-")){ const m = findMgr(h.slice(2)); if (m){ if (lastMgr !== m.id){ mgrQuery = ""; mgrView = "fc"; mgrBr = null; lastMgr = m.id } return renderMgr(m) } }
  if (h.startsWith("f-")){ const [m, f] = findFc(h.slice(2)); if (f) return renderFc(m, f) }
  renderHome();
}
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g){ go(g.dataset.go); return }
  const d = e.target.closest("[data-day]"); if (d){ const [id,k] = d.dataset.day.split("|"); toggleDay(id,k); return }
  if (e.target.closest("[data-clearq]")){ mgrQuery = ""; const q = $("#fcq"); if (q){ q.value = ""; q.focus() } applyFcFilter(); return }
  if (e.target.closest("[data-adm]")){ openAdminSheet(); return }
  if (e.target.closest("[data-admout]")){ adminLogout(); toast("관리자 모드를 해제했어요"); return }
  const v = e.target.closest("[data-view]"); if (v){ mgrView = v.dataset.view; mgrBr = null; mgrQuery = ""; render(); window.scrollTo(0,0); return }
  const br = e.target.closest("[data-br]"); if (br){ const b = app._brs && app._brs[+br.dataset.br]; if (b){ mgrView = "fc"; mgrBr = b.name; mgrQuery = ""; render(); window.scrollTo(0,0) } return }
  const x = e.target.closest("[data-export]"); if (x){ exportLink(x.dataset.export); return }
  const s = e.target.closest("[data-send]"); if (s){ openSend(s.dataset.send); return }
  const f = e.target.closest("[data-f]"); if (f){ fcFilter = f.dataset.f; render(); return }
  const dn = e.target.closest("[data-done]"); if (dn){ const id = location.hash.slice(3); toggleDone(id, dn.dataset.done); return }
  const lk = e.target.closest("[data-lock]"); if (lk){ delete opened[lk.dataset.lock]; store.set("code:"+lk.dataset.lock, null); render(); return }
});
window.addEventListener("hashchange", render);
loadAdmin().finally(render);
</script>
</body>
</html>
