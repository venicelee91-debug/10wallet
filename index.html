<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>10억통장 타겟 보내기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: 통장 한 권처럼 좁은 단일 컬럼(최대 560px). 홈 → 매니저 → FC 3단 화면, 카드는 FC·고객 단위로만 쓴다 */
:root{
  --bg:#eef1ef; --paper:#ffffff; --ink:#15211d; --muted:#5d6b66; --line:#d9e0dc;
  --accent:#0f6b4f; --accent-soft:#e2f1ea; --accent-ink:#ffffff;
  --gap:#b4520f; --gap-soft:#fbeee2; --chk:#4a5aa8; --chk-soft:#e8ebf8;
  --done:#8a9692;
  --f-body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:var(--f-body);
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --paper:#18211e; --ink:#e6ece9; --muted:#9aa8a2; --line:#2b3632;
  --accent:#4cc79a; --accent-soft:#16352b; --accent-ink:#06150f;
  --gap:#f0a464; --gap-soft:#3a2615; --chk:#9fadf0; --chk-soft:#222a4a; --done:#6b7773; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --paper:#18211e; --ink:#e6ece9; --muted:#9aa8a2; --line:#2b3632;
  --accent:#4cc79a; --accent-soft:#16352b; --accent-ink:#06150f;
  --gap:#f0a464; --gap-soft:#3a2615; --chk:#9fadf0; --chk-soft:#222a4a; --done:#6b7773; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:500}
.hero h1{font-size:24px;line-height:1.25;margin-top:4px;letter-spacing:-.025em}
.hero .sub{color:var(--accent);font-weight:700;font-size:17px;margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.02em}
.kpi .v small{font-family:var(--f-body);font-size:12px;font-weight:400;margin-left:1px}
.kpi.hl .v{color:var(--accent)}
.sec{font-weight:700;font-size:15px;margin:8px 2px 0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.mcard:hover{border-color:var(--accent)}
.mcard b{font-size:16px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:999px;padding:2px 8px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.a{background:var(--accent-soft);color:var(--accent);font-weight:500}
.pill.g{background:var(--gap-soft);color:var(--gap);font-weight:500}
.pill.c{background:var(--chk-soft);color:var(--chk);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
details.how{background:var(--bg);border-radius:10px;padding:8px 12px;font-size:13px}
details.how summary{cursor:pointer;color:var(--accent);font-weight:500;text-align:center;list-style:none}
details.how summary::-webkit-details-marker{display:none}
details.how ul{margin:8px 0 2px;padding-left:18px;color:var(--muted)}
.weeklbl{text-align:center;font-size:13px;color:var(--muted)}
/* FC row (매니저 화면) */
.fc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.fc.sent{opacity:.72}
.fc-head{display:flex;justify-content:space-between;gap:8px 10px;align-items:center;flex-wrap:wrap}
.fc-head .nm{font-size:17px;font-weight:700}
.fc-head .br{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.fc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;text-align:center}
.fc-stats div{background:var(--bg);border-radius:8px;padding:6px 4px}
.fc-stats .l{font-size:11px;color:var(--muted)}
.fc-stats .v{font-size:17px;font-weight:600}
.acts{display:flex;flex-direction:row;gap:6px;flex-shrink:0}
.acts .btn{padding:6px 10px;white-space:nowrap}
.days{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:4px;align-items:center;font-size:11px}
.days .wk{color:var(--muted);padding-right:4px}
.day{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:3px 0;text-align:center;line-height:1.2}
.day .d{font-family:var(--f-num);font-size:13px;font-weight:600}
.day.today{border-color:var(--accent);border-width:2px}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day.future{opacity:.6}
.seen{font-size:12px;color:var(--muted)}
/* 고객 카드 (FC 화면) */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.cu{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.cu.hot{border-color:color-mix(in srgb,var(--gap) 45%,var(--line))}
.cu.done{opacity:.6}
.cu-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cu-head .nm{font-size:17px;font-weight:700}
.meta{font-size:12px;color:var(--muted)}
.cov{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px;border-top:1px dashed var(--line);padding-top:8px}
.cov .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
.cov .v.no{color:var(--gap);font-family:var(--f-body);font-weight:700}
.point{background:var(--gap-soft);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:13px}
.point b{color:var(--gap)}
.point.c{background:var(--chk-soft)}
.point.c b{color:var(--chk)}
.point.ok{background:var(--accent-soft)}
.point.ok b{color:var(--accent)}
.cu-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* 잠금 화면 */
.lock{display:flex;flex-direction:column;gap:12px}
.lock input:not([type="checkbox"]){font:inherit;font-family:var(--f-num);font-size:20px;letter-spacing:.15em;text-transform:uppercase;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.err{color:var(--gap);font-size:13px;min-height:1.2em}
.chk-row{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer;user-select:none;width:fit-content}
.chk-row input[type="checkbox"]{width:18px;height:18px;margin:0;flex:none;accent-color:var(--accent);cursor:pointer}
/* 보내기 시트 */
.sheet{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:0 max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px))}
.sheet .box{background:var(--paper);color:var(--ink);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.sheet textarea{width:100%;min-height:190px;font:inherit;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1;padding:10px 12px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13px;z-index:40;max-width:calc(100% - 32px);text-align:center}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:24px 0}
@media (prefers-reduced-motion:no-preference){.fc,.cu{transition:opacity .2s}}
</style>
</head>

const PUBLISHED_URL = "https://claude.ai/artifact/ECSw7DD88HPmtnrThRBrMj";

const $ = (s, el=document) => el.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GAP = Object.fromEntries(DATA.gaps.map(g => [g.k, g.l]));

/* ---------- 저장(이 기기 브라우저에만) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("r10:"+k); return v==null ? d : JSON.parse(v) }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem("r10:"+k, JSON.stringify(v)) }catch(e){} }
};

/* ---------- 날짜 ---------- */
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = new Date(); const TODAY = iso(today);
function weeks(){
  const mon = new Date(today); const wd = (today.getDay()+6)%7; mon.setDate(today.getDate()-wd);
  if (wd >= 5) mon.setDate(mon.getDate()+7); // 주말이면 다음 주부터
  const mk = off => Array.from({length:5}, (_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+off+i); return d });
  return [mk(0), mk(7)];
}
const WD = ["월","화","수","목","금"];
const asofLbl = (() => { const d = new Date(DATA.asof+"T00:00:00"); return `${d.getMonth()+1}/${d.getDate()}(${"일월화수목금토"[d.getDay()]}) 기준` })();
const md = d => `${d.getMonth()+1}.${pad(d.getDate())}`;

/* ---------- 링크 ---------- */
const IN_VIEWER = (() => { const h = location.hostname; return !/^https?:$/.test(location.protocol) || /claude|anthropic|usercontent/i.test(h) || h === "" })();
function baseUrl(){
  const inViewer = IN_VIEWER;
  if (!inViewer) return location.href.split("#")[0];
  return PUBLISHED_URL.startsWith("http") ? PUBLISHED_URL : location.href.split("#")[0];
}
const linkFor = t => baseUrl() + "#" + t;

/* ---------- 찾기 ---------- */
const findMgr = id => DATA.mgrs.find(m => m.id === id);
function findFc(id){ for (const m of DATA.mgrs){ const f = m.fcs.find(f => f.id === id); if (f) return [m, f] } return [] }
const sentDays = fc => store.get("sent:"+fc.id, []);

/* ---------- 공통 ---------- */
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=> t.hidden = true, 2600) }
let inApp = false;
function go(hash){ inApp = true; if (location.hash === "#"+hash) render(); else location.hash = hash; window.scrollTo(0,0) }
async function copyText(text, ta){
  try { await navigator.clipboard.writeText(text); return true }
  catch(e){ if (ta){ ta.focus(); ta.select(); try { return document.execCommand("copy") } catch(_){} } return false }
}

  app.innerHTML = `
  <div class="top"><button class="btn" data-go="">‹ 홈</button><span class="eyebrow">${asofLbl}</span></div>
  <section class="panel hero" style="display:flex;flex-direction:column;gap:10px">
    <div><div class="eyebrow">10억통장 타겟 보내기</div><h1>${esc(m.name)} 매니저</h1></div>
    <div class="chips"><span class="pill">FC ${m.fcs.length}명</span><span class="pill">고객 ${n}명</span>
      <span class="pill a">오늘 보냄 ${sentToday}</span><span class="pill">한 번이라도 ${everSent}</span></div>
    <details class="how"><summary>사용법 보기</summary><ul>
      <li>「내보내기」 → 해당 FC의 고객보기 링크를 카톡으로 보내요 (휴대폰에선 공유창에서 카톡 선택, PC에선 링크가 복사돼요)</li>
      <li>「카톡 문구」 → 인원 요약이 들어간 문구와 링크를 함께 보내요</li>
      <li>보내면 오늘 칸이 초록으로 표시돼요</li>
      <li>카톡에서 해당 FC에게 붙여넣기 하면 끝</li>
      <li>잘못 표시했으면 그 날짜 칸을 한 번 더 누르면 지워져요</li>
      <li>순서: 미가입 3개↑ 고객 많은 FC → 오래 전에 보낸 FC, 오늘 보낸 FC는 맨 아래</li>
      <li>FC는 링크를 열고 본인 설계사코드를 넣어야 고객 목록을 볼 수 있어요</li>
      <li>보냄 표시는 이 휴대폰(브라우저)에만 저장돼요</li>
    </ul></details>
  </section>
  <div class="weeklbl">이번주 ${md(w1[0])}~${md(w1[4])} · 다음주 ${md(w2[0])}~${md(w2[4])}</div>
  ${fcs.map(f => {
    const st = sentDays(f).includes(TODAY);
    const gp = DATA.gaps.filter(g => f.s.g[g.k]).map(g => `<span class="pill g">${SHORT[g.k]} ${f.s.g[g.k]}</span>`).join("");
    return `<article class="fc ${st?'sent':''}">
      <div class="fc-head">
        <div style="min-width:0"><div class="nm">${esc(f.name)}</div><div class="br">${esc(f.br)}</div></div>
        <div class="acts"><button class="btn" data-go="f-${f.id}">고객보기</button>
          <button class="btn primary" data-export="${f.id}">내보내기</button>
          <button class="btn soft" data-send="${f.id}">카톡 문구</button></div>
      </div>
      <div class="fc-stats">
        <div><div class="l">고객</div><div class="v num">${f.s.n}</div></div>
        <div><div class="l">미가입 3개↑</div><div class="v num" style="color:var(--gap)">${f.s.hot}</div></div>
        <div><div class="l">보장확인</div><div class="v num" style="color:var(--chk)">${f.s.chk}</div></div>
      </div>
      ${gp ? `<div class="chips"><span class="meta" style="align-self:center">미가입</span>${gp}</div>` : ""}
      <div class="days"><span class="wk">이번주</span>${w1.map(d=>dayCell(f,d)).join("")}
        <span class="wk">다음주</span>${w2.map(d=>dayCell(f,d)).join("")}</div>
    </article>`}).join("")}
  <div class="foot">${esc(DATA.title)} · ${asofLbl}</div>`;
}
function toggleDay(fcid, k){
  const arr = store.get("sent:"+fcid, []);
  const i = arr.indexOf(k); if (i>=0) arr.splice(i,1); else arr.push(k);
  store.set("sent:"+fcid, arr); render();
}
function markSent(fcid){
  const arr = store.get("sent:"+fcid, []);
  if (!arr.includes(TODAY)){ arr.push(TODAY); store.set("sent:"+fcid, arr) }
}
/* 내보내기: FC 화면 링크만 보내기. GitHub 등 바깥 주소에서는 공유창(카톡 선택), 아니면 링크 복사 */
async function exportLink(fcid){
  const [m, f] = findFc(fcid); if (!f) return;
  const url = linkFor("f-"+f.id);
  if (!IN_VIEWER && navigator.share){
    try {
      await navigator.share({title: `${f.name} 설계사님 고객 리스트`, text: `[10억통장 타겟] ${f.name} 설계사님 고객 리스트예요. 비밀번호는 설계사코드(6자리)예요.`, url});
      markSent(f.id); toast("보냄으로 표시했어요"); render(); return;
    } catch(err){ if (err && err.name === "AbortError") return }
  }
  try {
    await navigator.clipboard.writeText(url);
    markSent(f.id); toast(`${f.name} 설계사님 링크를 복사했어요. 카톡에 붙여넣기 하세요`); render();
  } catch(_){
    const el = document.createElement("div"); el.className = "sheet";
    el.innerHTML = `<div class="box" role="dialog" aria-label="FC 링크">
      <div class="top"><b>${esc(f.name)} 설계사님 링크</b><button class="btn" data-x>닫기</button></div>
      <div class="meta">아래 링크를 길게 눌러 복사한 뒤 카톡으로 보내 주세요.</div>
      <input id="link-${f.id}" readonly value="${esc(url)}" style="font:inherit;font-size:13px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%">
      <div class="row"><button class="btn primary" data-mark>보냈어요 (오늘 표시)</button></div></div>`;
    document.body.appendChild(el);
    const inp = el.querySelector("input"); inp.focus(); inp.select();
    el.addEventListener("click", e => {
      if (e.target === el || e.target.closest("[data-x]")) return el.remove();
      if (e.target.closest("[data-mark]")){ markSent(f.id); el.remove(); render() }
    });
  }
}
function openSend(fcid){
  const [m, f] = findFc(fcid); if (!f) return;
  const el = document.createElement("div"); el.className = "sheet";
  el.innerHTML = `<div class="box" role="dialog" aria-label="카톡 문구">
    <div class="top"><b>${esc(f.name)} 설계사님께 보낼 문구</b><button class="btn" data-x>닫기</button></div>
    <textarea id="msg-${f.id}" aria-label="보낼 문구">${esc(msgFor(m,f))}</textarea>
    ${(!IN_VIEWER && navigator.share) ? `<div class="row"><button class="btn primary" data-share>카톡으로 보내기 (공유창)</button></div>` : ""}
    <div class="row"><button class="btn ${(!IN_VIEWER && navigator.share)?'':'primary'}" data-copy>복사하고 오늘 보냄 표시</button><button class="btn" data-copyonly>복사만</button></div>
  </div>`;
  document.body.appendChild(el);
  const ta = el.querySelector("textarea");
  const close = () => el.remove();
  el.addEventListener("click", async e => {
    if (e.target === el || e.target.closest("[data-x]")) return close();
    if (e.target.closest("[data-share]")){
      try {
        await navigator.share({text: ta.value});
        const arr = store.get("sent:"+f.id, []); if (!arr.includes(TODAY)){ arr.push(TODAY); store.set("sent:"+f.id, arr) }
        toast("보냄으로 표시했어요"); close(); render();
      } catch(err){ if (err && err.name !== "AbortError") toast("공유창이 열리지 않아요. 복사해서 보내 주세요") }
      return;
    }
    const mark = e.target.closest("[data-copy]"), only = e.target.closest("[data-copyonly]");
    if (!mark && !only) return;
    const ok = await copyText(ta.value, ta);
    if (mark){ const arr = store.get("sent:"+f.id, []); if (!arr.includes(TODAY)){ arr.push(TODAY); store.set("sent:"+f.id, arr) } }
    toast(ok ? "복사했어요. 카톡에 붙여넣기 하세요" : "복사가 막혀 있어요. 글을 길게 눌러 직접 복사해 주세요");
    if (ok){ close(); render() }
  });
}

/* ---------- FC 화면 ---------- */
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(enc, code){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code.trim().toUpperCase()), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64d(enc.s), iterations:DATA.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(enc.i)}, key, b64d(enc.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
const opened = {};   // 이번 방문 동안 푼 데이터
let fcFilter = "all";
function renderFcLock(m, f, err){
  app.innerHTML = `
  <div class="top">${inApp?`<button class="btn" data-go="m-${m.id}">‹ 매니저 화면</button>`:"<span></span>"}<span class="eyebrow">${asofLbl}</span></div>
  <section class="panel lock">
    <div><div class="eyebrow">10억통장 타겟 · ${esc(m.name)} 매니저</div>
      <h1 style="font-size:22px;margin-top:4px">${esc(f.name)} 설계사님</h1>
      <div class="muted" style="font-size:14px">보장 보완하실 고객 ${f.s.n}명을 정리했어요.</div></div>
    <form id="lockf" class="lock" autocomplete="off">
      <label for="code-${f.id}" class="meta">설계사코드 6자리를 넣어 주세요</label>
      <input id="code-${f.id}" inputmode="text" maxlength="8" placeholder="예) 4AB123" autocapitalize="characters" spellcheck="false">
      <label class="chk-row"><input type="checkbox" id="rem-${f.id}" checked> 이 휴대폰에서 다음부터 바로 열기</label>
      <div class="err" id="err">${esc(err||"")}</div>
      <button class="btn primary" style="padding:12px" type="submit">고객 목록 열기</button>
    </form>
  </section>`;
  const inp = $("#code-"+f.id); inp.focus();
  $("#lockf").addEventListener("submit", async e => {
    e.preventDefault();
    const code = inp.value; if (!code.trim()) return;
    $("#err").textContent = "여는 중…";
    try {
      opened[f.id] = await decrypt(f.enc, code);
      if ($("#rem-"+f.id).checked) store.set("code:"+f.id, code.trim().toUpperCase());
      fcFilter = "all"; render();
    } catch(_){ $("#err").textContent = "코드가 맞지 않아요. 설계사코드를 다시 확인해 주세요."; inp.select() }
  });
}
async function renderFc(m, f){
  if (!opened[f.id]){
    const saved = store.get("code:"+f.id, null);
    if (saved){ try { opened[f.id] = await decrypt(f.enc, saved) } catch(_){ store.set("code:"+f.id, null) } }
    if (!opened[f.id]) return renderFcLock(m, f);
  }
  const done = store.get("done:"+f.id, {});
  const cs = opened[f.id].cs.map((c,i) => ({...c, i}));
  const counts = {all: cs.length, hot: cs.filter(c=>c.gaps.length>=3).length, chk: cs.filter(c=>!c.q2).length};
  DATA.gaps.forEach(g => counts[g.k] = cs.filter(c=>c.gaps.includes(g.k)).length);
  const pass = c => fcFilter==="all" ? true : fcFilter==="hot" ? c.gaps.length>=3 : fcFilter==="chk" ? !c.q2 : c.gaps.includes(fcFilter);
  const list = cs.filter(pass).sort((a,b) => (!!done[a.i] - !!done[b.i]) || (b.gaps.length - a.gaps.length) || (b.q2 - a.q2));
  const fl = [["all","전체"],["hot","미가입 3개↑"],...DATA.gaps.map(g=>[g.k, SHORT[g.k]+" 미가입"]),["chk","보장확인 필요"]]
    .filter(([k]) => counts[k] || k==="all");
  const card = c => {
    const cls = c.gaps.length>=3 ? "hot" : (!c.q2 ? "chk" : "");
    const who = [c.age!=null ? c.age+"세" : null, c.sex].filter(Boolean).join(" ");
    const prods = c.prods.map(p => `${esc(p.p)} ${esc(p.d)}`).join(" · ");
    let cov = "", point;
    if (c.cov){
      cov = `<div class="cov">${DATA.gaps.map(g => `<span>${g.l}</span>${c.cov[g.k] ? `<span class="v">${esc(c.cov[g.k])}</span>` : `<span class="v no">미가입</span>`}`).join("")}</div>`;
      point = c.gaps.length
        ? `<div class="point"><b>미가입 ${c.gaps.length}개</b> · ${c.gaps.map(k=>GAP[k]).join(", ")} 추가 설계 제안${c.recent ? " (최근 체결 고객이라 관계 살아 있을 때 연락하기 좋아요)" : ""}</div>`
        : `<div class="point ok"><b>주요 담보 모두 가입</b> · 금액이 적은 담보가 있으면 증액 제안</div>`;
    } else {
      point = `<div class="point c"><b>보장 확인 필요</b> · 최근 체결 고객이에요. 보장분석으로 현재 보장부터 확인해 보세요</div>`;
    }
    return `<article class="cu ${cls} ${done[c.i]?'done':''}">
      <div class="cu-head"><div><span class="nm">${esc(c.nm)}</span> <span class="meta">${esc(who)}</span></div>
        <div class="chips">${c.q2?'<span class="pill a">2Q PASS</span>':''}${c.recent?'<span class="pill c">최근체결</span>':''}</div></div>
      <div class="meta">${prods} 체결${c.agree?` · 설계동의 ${esc(c.agree)}`:""}</div>
      ${cov}${point}
      <div class="cu-foot"><span class="meta">${done[c.i] ? "연락함 · "+esc(done[c.i]) : "아직 연락 전"}</span>
        <button class="btn ${done[c.i]?'':'soft'}" data-done="${c.i}">${done[c.i] ? "연락 취소" : "연락함 표시"}</button></div>
    </article>`;
  };
  const doneN = Object.keys(done).length;
  app.innerHTML = `
  <div class="top">${inApp?`<button class="btn" data-go="m-${m.id}">‹ 매니저 화면</button>`:"<span></span>"}<button class="btn" data-lock="${f.id}">잠그기</button></div>
  <section class="panel hero">
    <div class="eyebrow">10억통장 타겟 · ${esc(m.name)} 매니저 · ${asofLbl}</div>
    <h1>${esc(f.name)} 설계사님 10억통장 가능성 높은 고객</h1>
    <div class="muted" style="font-size:13px;overflow-wrap:anywhere">${esc(f.br)}</div>
  </section>
  <div class="kpis">
    <div class="kpi"><div class="l">대상 고객</div><div class="v num">${cs.length}<small>명</small></div></div>
    <div class="kpi hl"><div class="l">미가입 3개↑</div><div class="v num" style="color:var(--gap)">${counts.hot}<small>명</small></div></div>
    <div class="kpi"><div class="l">연락함</div><div class="v num">${doneN}<small>명</small></div></div>
  </div>
  <div class="filters" role="group" aria-label="고객 거르기">
    ${fl.map(([k,l]) => `<button data-f="${k}" aria-pressed="${fcFilter===k}">${l} ${counts[k]}</button>`).join("")}
  </div>
  ${list.length ? list.map(card).join("") : `<div class="empty">이 조건의 고객이 없어요.</div>`}
  <div class="foot">미가입 담보가 많은 고객부터 보여요. 연락함 표시는 이 휴대폰에만 저장돼요.</div>`;
}
function toggleDone(fcid, i){
  const done = store.get("done:"+fcid, {});
  if (done[i]) delete done[i]; else done[i] = `${today.getMonth()+1}/${today.getDate()}`;
  store.set("done:"+fcid, done); render();
}

/* ---------- 라우팅 ---------- */
function render(){
  const h = location.hash.slice(1);
  if (h.startsWith("m-")){ const m = findMgr(h.slice(2)); if (m) return renderMgr(m) }
  if (h.startsWith("f-")){ const [m, f] = findFc(h.slice(2)); if (f) return renderFc(m, f) }
  renderHome();
}
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g){ go(g.dataset.go); return }
  const d = e.target.closest("[data-day]"); if (d){ const [id,k] = d.dataset.day.split("|"); toggleDay(id,k); return }
  const x = e.target.closest("[data-export]"); if (x){ exportLink(x.dataset.export); return }
  const s = e.target.closest("[data-send]"); if (s){ openSend(s.dataset.send); return }
  const f = e.target.closest("[data-f]"); if (f){ fcFilter = f.dataset.f; render(); return }
  const dn = e.target.closest("[data-done]"); if (dn){ const id = location.hash.slice(3); toggleDone(id, dn.dataset.done); return }
  const lk = e.target.closest("[data-lock]"); if (lk){ delete opened[lk.dataset.lock]; store.set("code:"+lk.dataset.lock, null); render(); return }
});
window.addEventListener("hashchange", render);
render();
</script>
